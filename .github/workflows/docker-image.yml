name: Docker Image CI

on:
  push:
    branches:
      - "master"
      - "develop"
  pull_request:
    branches:
      - "master"
      - "develop"

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Build the Docker image
      run: docker build -t dsa-bot-v2:$(date +%s) . --file Dockerfile

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
